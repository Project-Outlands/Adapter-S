# Gradle Properties
org.gradle.jvmargs = -Xmx3G

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = false
show_testing_output = false

# Shadow
enable_shadow = false

# Set this to true if you want to use old LWJGL2 methods.
# WARNING: Using LWJGL2 is no longer recommend, and some methods in LWJGL2 will be unavailable.
# If you are porting an old mod lazily just set this to true.
enable_lwjglx = true

# Mod Information
# HIGHLY RECOMMEND complying with SemVer for mod_version: https://semver.org/
mod_version = 3.10.1
root_package = top.outlands
mod_id = adapter-s
mod_name = Adapter-S

# Scala runtime shipped as a bundled library. Kept apart from mod_version so the provider's own version and the
# language version it serves can move independently.
scala_version = 3.10.1
scala_parser_combinators_version = 2.5.0

# Mod Metadata (Optional)
mod_description = Scala language adapter, ships Scala 3.x
mod_url = https://github.com/Project-Outlands/Adapter-S
mod_update_json =
# Delimit authors with commas
mod_authors = kappa_maintainer
mod_credits = CleanroomMC
mod_logo_path =
mod_issue_tracker = https://github.com/Project-Outlands/Adapter-S/issues
# SPDX identifier and/or a link to the licence text. Required by the jar section of mcmod.info.
mod_license = LGPL-2.1-or-later

# Run Configurations
# If multiple arguments/tweak classes are stated, use spaces as the delimiter
minecraft_username = Developer
extra_jvm_args =
enable_foundation_debug = false

# Maven Publishing (Provide secret: MAVEN_USER, MAVEN_PASS)
publish_to_maven = false
# Good for debugging artifacts before uploading to remote maven
# GitHub actions won't run if this is true, test this by running the task `publishToMavenLocal`
publish_to_local_maven = false
maven_name = Adapter-S
maven_url = https://maven.outlands.top/releases

# If any properties changes below this line, refresh gradle again to ensure everything is working correctly.
# ----------------------------------------------------------------------------------------------------------------------

# Access Transformers
# Adapter-S does not touch Minecraft's visibility, so nothing is declared here.
use_access_transformer = false

# Coremods
# Adapter-S registers its language adapter declaratively through the mcmod.info jar section, so it needs neither an
# IFMLLoadingPlugin nor a hand-written ModContainer.
is_coremod = false
coremod_includes_mod = true
coremod_plugin_class_name =

# AssetMover
# Convenient way to allow downloading of assets from official vanilla Minecraft servers, CurseForge, or any direct links
# Documentation: https://github.com/CleanroomMC/AssetMover
use_asset_mover = false
asset_mover_version = 2.5
